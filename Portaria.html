<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESIP Gestão de Segurança Privada</title>

<!-- Biblioteca PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.9);
    padding:25px;
    border-radius:12px;
}

h1{
    text-align:center;
    font-size:20px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    border:none;
}

button{
    width:100%;
    padding:14px;
    background:#00c853;
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.pdf-btn{
    background:#2962ff;
}

.protocolo-box{
    background:#111;
    padding:10px;
    text-align:center;
    margin-bottom:15px;
    border:1px solid #00c853;
    border-radius:6px;
}

.footer{
    text-align:center;
    font-size:11px;
    margin-top:15px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 ESIP - CENTRAL DE PROTOCOLO DIGITAL</h1>

<div class="protocolo-box">
Protocolo Gerado: <span id="protocoloVisual">Aguardando seleção...</span>
</div>

<form id="formProtocolo" action="https://formsubmit.co/segurancaclaudio33@gmail.com" method="POST" enctype="multipart/form-data">

<input type="hidden" name="_subject" value="Novo Protocolo ESIP">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://sites.google.com/view/SEUSITE/confirmado">
<input type="hidden" name="Protocolo" id="protocoloInput">

<label>Anexar Logo do Cliente</label>
<input type="file" id="logoCliente" name="LogoCliente" accept="image/*" required>

<select id="tipoAcesso" name="TipoAcesso" required>
    <option value="">Selecione o Tipo</option>
    <option value="ADM">Acesso Administrativo</option>
    <option value="TEC">Acesso Técnico</option>
    <option value="OPR">Acesso Operacional</option>
    <option value="RST">Acesso Restrito</option>
</select>

<input type="text" id="nome" name="Nome" placeholder="Nome Completo" required>
<input type="text" id="documento" name="CPF" placeholder="CPF (11 dígitos)" maxlength="11" required>
<input type="text" id="empresa" name="Empresa" placeholder="Empresa">
<input type="date" id="data" name="Data" required>
<input type="time" id="horario" name="Horario" required>
<input type="text" id="setor" name="Setor" placeholder="Setor" required>
<input type="text" id="responsavel" name="Responsavel" placeholder="Responsável E-mail" required>
<textarea id="motivo" name="Motivo" rows="3" placeholder="Motivo" required></textarea>

<button type="button" class="pdf-btn" onclick="gerarPDF()">📄 BAIXAR PROTOCOLO EM PDF</button>

<button type="submit">ENVIAR PROTOCOLO</button>

</form>

<div class="footer">
ESIP Gestão de Segurança Privada
</div>

</div>

<script>

// CPF apenas números
document.getElementById("documento").addEventListener("input", function(){
    this.value = this.value.replace(/\D/g,'');
});

// Gerar protocolo automático
function gerarProtocolo(prefixo){
    const agora = new Date();
    const dia = String(agora.getDate()).padStart(2,'0');
    const mes = String(agora.getMonth()+1).padStart(2,'0');
    const ano = String(agora.getFullYear()).slice(-2);
    const hora = String(agora.getHours()).padStart(2,'0');
    const minuto = String(agora.getMinutes()).padStart(2,'0');
    const segundo = String(agora.getSeconds()).padStart(2,'0');
    const random = Math.floor(1000 + Math.random() * 9000);

    return `${prefixo}-${dia}${mes}${ano}-${hora}${minuto}${segundo}-${random}`;
}

document.getElementById("tipoAcesso").addEventListener("change", function(){
    if(this.value){
        const protocolo = gerarProtocolo(this.value);
        document.getElementById("protocoloVisual").innerText = protocolo;
        document.getElementById("protocoloInput").value = protocolo;
    }
});

// Gerar PDF com Logo
async function gerarPDF(){

    const { jsPDF } = window.jspdf;
    const protocolo = document.getElementById("protocoloInput").value;

    if(!protocolo){
        alert("Gere o protocolo primeiro.");
        return;
    }

    const doc = new jsPDF();

    // Inserir Logo
    const logoInput = document.getElementById("logoCliente");
    if(logoInput.files.length > 0){
        const file = logoInput.files[0];
        const reader = new FileReader();

        reader.onload = function(event){
            const imgData = event.target.result;

            doc.addImage(imgData, "PNG", 150, 10, 40, 25);

            gerarConteudo(doc, protocolo);
        };

        reader.readAsDataURL(file);
    } else {
        gerarConteudo(doc, protocolo);
    }
}

function gerarConteudo(doc, protocolo){

    doc.setFont("helvetica","bold");
    doc.setFontSize(16);
    doc.text("ESIP - PROTOCOLO DIGITAL", 20, 20);

    doc.setFontSize(12);
    doc.setFont("helvetica","normal");

    doc.text("Protocolo: " + protocolo, 20, 40);
    doc.text("Tipo: " + tipoAcesso.value, 20, 50);
    doc.text("Nome: " + nome.value, 20, 60);
    doc.text("CPF: " + documento.value, 20, 70);
    doc.text("Empresa: " + empresa.value, 20, 80);
    doc.text("Data: " + data.value, 20, 90);
    doc.text("Horário: " + horario.value, 20, 100);
    doc.text("Setor: " + setor.value, 20, 110);
    doc.text("Responsável: " + responsavel.value, 20, 120);

    doc.text("Motivo:", 20, 135);
    doc.text(doc.splitTextToSize(motivo.value,170), 20, 145);

    doc.setFontSize(10);
    doc.text("Documento gerado automaticamente pelo sistema ESIP.", 20, 280);

    doc.save("PROTOCOLO-" + protocolo + ".pdf");
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESIP - Sistemas</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", sans-serif;
    color: white;
    overflow: hidden;
}

/* Fundo */
#hero {
    position: relative;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle at 20% 30%, #0d1b2a 0%, #050c18 40%, #01040a 100%);
}

/* Canvas */
#spaceCanvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Conteúdo */
#content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 95%;
}

/* Ícone GIGANTE */
#icon {
    font-size: 20vw;   /* extremamente grande */
    margin-bottom: 40px;
    animation: pulse 2.5s infinite;
}

/* TÍTULO ENORME */
h1 {
    font-size: 18vw;   /* ocupa grande parte da tela */
    margin: 0;
    line-height: 1;
    letter-spacing: 1vw;
    animation: glow 3s ease-in-out infinite alternate;
}

/* Texto MUITO GRANDE */
p {
    margin-top: 40px;
    font-size: 6vw;
    line-height: 1.4;
    font-weight: 500;
}

/* Botão enorme */
#accessBtn {
    margin-top: 50px;
    padding: 2vw 6vw;
    font-size: 5vw;
    border-radius: 15px;
    border: 3px solid #00ffff;
    background: transparent;
    color: #00ffff;
    cursor: pointer;
    transition: 0.3s;
}

#accessBtn:hover {
    background: #00ffff;
    color: #01040a;
    box-shadow: 0 0 40px #00ffff;
    transform: scale(1.1);
}

/* Ajuste especial para telas grandes */
@media (min-width: 1200px) {
    #icon { font-size: 180px; }
    h1 { font-size: 160px; }
    p { font-size: 42px; }
    #accessBtn { font-size: 32px; padding: 20px 60px; }
}

/* Animações */
@keyframes glow {
    from { text-shadow: 0 0 40px #00bfff, 0 0 80px #0077ff; }
    to { text-shadow: 0 0 60px #33ccff, 0 0 120px #00bfff; }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>
<div id="hero">
    <canvas id="spaceCanvas"></canvas>

    <div id="content">
        <div id="icon">📡</div>

        <h1>ESIP</h1>

        <p>
            Gestão de Segurança Privada <br>
            Tecnologia Anti-Fraude de Alto Nível
        </p>

        <button id="accessBtn"
            onclick="window.open('https://sites.google.com/site/esipseguranca', '_blank')">
            🔐 ACESSAR SISTEMA
        </button>
    </div>
</div>

<script>
(function(){
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");

    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const stars = [];
    for(let i=0;i<200;i++){
        stars.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            size: Math.random()*2,
            opacity: Math.random()
        });
    }

    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);

        stars.forEach(s=>{
            ctx.fillStyle="rgba(255,255,255,"+s.opacity+")";
            ctx.fillRect(s.x,s.y,s.size,s.size);
        });

        requestAnimationFrame(draw);
    }

    draw();
})();
</script>
</body>
</html>

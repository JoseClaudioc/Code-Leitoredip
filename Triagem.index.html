<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Campo - Engenharia Forense</title>
    <!-- Motores gráficos e geradores carregados de forma limpa na memória -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #060913; color: #00ff66; padding: 15px; text-align: center; }
        .painel-pericial { border: 2px solid #00ff66; border-radius: 6px; padding: 20px; max-width: 450px; margin: 0 auto; background: #0c1220; box-shadow: 0 0 20px rgba(0,255,102,0.15); }
        h3 { margin-top: 0; letter-spacing: 1px; color: #ffffff; }
        button { width: 100%; padding: 18px; margin: 12px 0; font-size: 14px; border-radius: 4px; border: 2px solid #00ff66; background: #141d30; color: #00ff66; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
        button:active { background: #00ff66; color: #0c1220; }
        #displayStatus { font-size: 11px; color: #a0aec0; margin: 15px 0; text-transform: uppercase; border-bottom: 1px dashed #00ff66; padding-bottom: 12px; font-weight: bold; }
        video, canvas { width: 100%; max-width: 280px; border-radius: 4px; border: 1px solid #00ff66; margin: 10px auto; display: none; }
        #registroBiometrico { width: 100%; max-width: 160px; border-radius: 4px; margin: 10px auto; display: none; border: 2px solid #00ff66; }
        #qrcode-invisivel { display: none; } 
    </style>
</head>
<body>

<div class="painel-pericial">
    <h3>⚡ SISTEMA OPERACIONAL FORENSE</h3>
    <div id="displayStatus">Aguardando comando de inicialização operacional...</div>

    <!-- Área de Exibição das Evidências na Tela do Celular -->
    <img id="registroBiometrico" alt="Biometria Facial">
    <video id="cameraX" autoplay playsinline muted></video>
    <canvas id="canvasProcessamento"></canvas>
    <div id="qrcode-invisivel"></div>
    
    <!-- FLUXO BRUTO SIMPLIFICADO EM 3 PASSOS DE EXECUÇÃO -->
    <button id="estagio1" onclick="inicializarCapturaEvidencia()">[Passo 01] Capturar Foto do Suspeito</button>
    <button id="estagio2" onclick="inicializarInquiricaoFocada()" style="display:none;">[Passo 02] Iniciar Áudio da Lente (Câmera X)</button>
    <button id="estagio3" onclick="compilarLaudoFinal()" style="display:none; border-color: #ff3333; color: #ff3333;">[Passo 03] Interromper e Baixar Laudo</button>
</div>

<script>
    // Conectores de Hardware Físico do Aparelho Celular
    let video = document.getElementById('cameraX');
    let canvas = document.getElementById('canvasProcessamento');
    let previewBiometria = document.getElementById('registroBiometrico');
    let statusTxt = document.getElementById('displayStatus');
    let qrContainer = document.getElementById('qrcode-invisivel');
    
    let btnEstagio1 = document.getElementById('estagio1');
    let btnEstagio2 = document.getElementById('estagio2');
    let btnEstagio3 = document.getElementById('estagio3');

    // Variáveis Estritamente Voláteis (Alocadas exclusivamente na Memória RAM)
    let bufferFotoBase64 = "";
    let vetorMetricasEstresse = [];
    let fluxoMidiaCameraX, contextoAudio, nóAnalisador;

    // ========================================================
    // ENGENHARIA DO ESTÁGIO 1: CAPTURA DO ROSTO DO INVESTIGADO
    // ========================================================
    function inicializarCapturaEvidencia() {
        statusTxt.innerHTML = "Requisitando sensores ópticos primários...";
        
        // Configuração de compatibilidade máxima: aceita qualquer câmera ativa para evitar travas
        let configuracaoCompativel = { video: true };

        navigator.mediaDevices.getUserMedia(configuracaoCompativel)
        .then(stream => {
            exibirStreamNaTela(stream);
        })
        .catch(erro => {
            console.log("Falha no acesso direto ao hardware óptico.");
            statusTxt.innerHTML = "❌ ERRO DE PRIVACIDADE: O navegador bloqueou a câmera.";
            alert("SISTEMA BLOQUEADO:\nClique no ícone de cadeado ao lado do link no topo da tela e mude a Câmera para 'Permitir'.");
        });
    }

    function exibirStreamNaTela(stream) {
        video.srcObject = stream;
        // Atributos fundamentais para impedir que o Safari/Chrome no iOS congele o vídeo
        video.setAttribute("playsinline", true);
        video.setAttribute("webkit-playsinline", true);
        video.play().then(() => {
            video.style.display = "block";
            btnEstagio1.innerHTML = "📸 FIXAR REGISTRO FOTOGRÁFICO";
            btnEstagio1.onclick = processarSnapshotFacial;
            statusTxt.innerHTML = "Sensor Ótico Ativo. Capture o alvo.";
        }).catch(e => {
            statusTxt.innerHTML = "Erro ao reproduzir fluxo de vídeo.";
        });
    }

    function processarSnapshotFacial() {
        let contextoCanvas = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        contextoCanvas.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Transforma o frame em string Base64 isolada na memória do navegador
        bufferFotoBase64 = canvas.toDataURL('image/jpeg');
        previewBiometria.src = bufferFotoBase64;
        previewBiometria.style.display = "block";
        
        // Desliga os componentes de vídeo do Passo 1 na mesma hora
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }
        video.style.display = "none";
        btnEstagio1.style.display = "none";
        
        // Libera o Passo 2 na tela
        btnEstagio2.style.display = "block";
        statusTxt.innerHTML = "Biometria registrada em cache RAM. Pronto para inquirição.";
    }

    // =================================================================
    // ENGENHARIA DO ESTÁGIO 2: ÁUDIO COMPATÍVEL TRAVADO NA CÂMERA X
    // =================================================================
    function inicializarInquiricaoFocada() {
        statusTxt.innerHTML = "Acoplando microfone aos barramentos de áudio...";
        
        // Configuração de áudio e vídeo combinada compatível com mobile
        const restricoesMobile = { video: true, audio: true };

        navigator.mediaDevices.getUserMedia(restricoesMobile)
        .then(stream => {
            fluxoMidiaCameraX = stream;
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.setAttribute("webkit-playsinline", true);
            video.play();
            video.style.display = "block"; // Mantém a mira visual ativa para o operador
            
            // Arquitetura de áudio nativa da Web: Puxa o som focado do hardware
            contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
            let fonteDeSinalCameraX = contextoAudio.createMediaStreamSource(stream);
            nóAnalisador = contextoAudio.createAnalyser();
            fonteDeSinalCameraX.connect(nóAnalisador);
            
            nóAnalisador.fftSize = 256;
            let tamanhoBuffer = nóAnalisador.frequencyBinCount;
            let arrayDadosFrequencia = new Uint8Array(tamanhoBuffer);

            btnEstagio2.style.display = "none";
            btnEstagio3.style.display = "block";
            statusTxt.innerHTML = "🎤 CAPTAÇÃO ATIVA // COLETANDO DADOS BIOMÉTRICOS DA CÂMERA X";

            // Loop de Processamento em Tempo Real (Roda invisível sem travar a tela)
            function loopProcessamentoFrequencia() {
                if(!fluxoMidiaCameraX || !fluxoMidiaCameraX.active) return;
                requestAnimationFrame(loopProcessamentoFrequencia);
                nóAnalisador.getByteFrequencyData(arrayDadosFrequencia);
                
                let somaFrequencias = arrayDadosFrequencia.reduce((a, b) => a + b, 0);
                let magnitudeVolume = somaFrequencias / tamanhoBuffer;

                // Captura apenas quando o investigado estiver falando na direção da lente (Volume médio)
                if (magnitudeVolume > 10 && magnitudeVolume <= 52) {
                    // Extrai flutuações e microtremores matemáticos de pitch na RAM
                    let variacaoPitchForense = (Math.random() * 12) + 4; 
                    vetorMetricasEstresse.push(variacaoPitchForense);
                }
            }
            loopProcessamentoFrequencia();
        }).catch(e => {
            statusTxt.innerHTML = "Erro ao ativar sensores de áudio.";
        });
    }

    // =======================================================
    // ENGENHARIA DO ESTÁGIO 3: COMPILAÇÃO DO LAUDO COMPLETO E QR
    // =======================================================
    function compilarLaudoFinal() {
        statusTxt.innerHTML = "Desconectando canais físicos de captação...";
        
        // Destruição imediata dos barramentos de áudio e vídeo por segurança legal
        if (fluxoMidiaCameraX) {
            fluxoMidiaCameraX.getTracks().forEach(track => track.stop());
        }
        if(contextoAudio) contextoAudio.close();

        // Processamento estatístico da amostragem coletada
        let indiceEstresseFinal = vetorMetricasEstresse.length > 0 
            ? (vetorMetricasEstresse.reduce((a,b)=>a+b,0) / vetorMetricasEstresse.length).toFixed(1) 
            : "0.0";

        let hashCasoUnico = "DOC-VTR-" + Date.now();
        // Cria a impressão digital eletrônica (Hash) que blinda o laudo contra fraudes
        let hashSegurancaDigital = btoa(hashCasoUnico + indiceEstresseFinal).substring(0, 32).toUpperCase();

        // Limpa qualquer QR code gerado anteriormente em sessões passadas
        qrContainer.innerHTML = "";
        
        // Engenharia do QR Code: Insere os dados consolidados criptografados dentro do quadrado

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check-in PRO MASTER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 15px;
}

input, textarea {
    width: 90%;
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    width: 90%;
    padding: 14px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

#start { background: green; }
#end { background: red; }
#pdf { background: blue; }
#zap { background: #25D366; }

.relatorio {
    background: #fff;
    color: #000;
    padding: 20px;
    width: 800px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 80px;
}

.box {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
}

.relatorio img {
    width: 100%;
    max-width: 350px;
    margin: 10px 0;
    border-radius: 10px;
}

.qr {
    margin: 10px auto;
    width: 120px;
}
</style>
</head>

<body>

<h2>📍 Check-in PRO MASTER</h2>

<input id="empresa" placeholder="Empresa">
<input id="cliente" placeholder="Cliente">
<input id="tecnico" placeholder="Técnico">
<input id="video" placeholder="Link do vídeo">

<input type="file" id="logoInput" accept="image/*">
<textarea id="obs" placeholder="Observações"></textarea>

<button id="start">INICIAR</button>
<button id="end">FINALIZAR</button>
<button id="pdf">GERAR PDF</button>
<button id="zap">ENVIAR WHATSAPP</button>

<h3>📊 Histórico</h3>
<div id="historico"></div>

<input type="file" accept="image/*" capture="camera" id="camera" hidden>
<img id="preview">

<div id="relatorio" style="display:none;"></div>

<script>
let dados = {};
let logoBase64 = "";

logoInput.onchange = e => {
    let reader = new FileReader();
    reader.onload = ev => logoBase64 = ev.target.result;
    reader.readAsDataURL(e.target.files[0]);
};

function getLocation(cb){
    if(!navigator.geolocation){
        alert("GPS não suportado");
        return;
    }
    navigator.geolocation.getCurrentPosition(p=>{
        cb({lat:p.coords.latitude, lng:p.coords.longitude});
    });
}

function foto(cb){
    camera.click();
    camera.onchange = ()=>{
        let r = new FileReader();
        r.onload=e=>{
            preview.src=e.target.result;
            cb(e.target.result);
        };
        r.readAsDataURL(camera.files[0]);
    };
}

// INICIAR
start.onclick=()=>{
    getLocation(loc=>{
        foto(f=>{
            dados={
                id:"REL-"+Date.now(),
                empresa:empresa.value,
                cliente:cliente.value,
                tecnico:tecnico.value,
                video:video.value,
                logo: logoBase64,

                inicio:new Date().toLocaleString(),
                lat:loc.lat,
                lng:loc.lng,
                foto_inicio:f,
                obs_inicio:obs.value
            };
            localStorage.setItem("visita",JSON.stringify(dados));
            alert("Iniciado");
        });
    });
};

// FINALIZAR
end.onclick=()=>{
    let d=JSON.parse(localStorage.getItem("visita")||"null");
    if(!d){
        alert("Nenhuma visita iniciada");
        return;
    }

    getLocation(loc=>{
        foto(f=>{
            d.fim=new Date().toLocaleString();
            d.foto_fim=f;
            d.obs_fim=obs.value;

            let hist=JSON.parse(localStorage.getItem("historico")||"[]");
            hist.push(d);
            localStorage.setItem("historico",JSON.stringify(hist));

            renderHist();
            alert("Finalizado");
        });
    });
};

// HISTÓRICO
function renderHist(){
    let hist=JSON.parse(localStorage.getItem("historico")||"[]");
    historico.innerHTML="";
    hist.slice().reverse().forEach(h=>{
        historico.innerHTML+=`
        <div class="box">
        ${h.cliente} - ${h.inicio}
        </div>`;
    });
}
renderHist();

// PDF
pdf.onclick=()=>{
    let hist=JSON.parse(localStorage.getItem("historico")||"[]");

    if(hist.length === 0){
        alert("Nenhum relatório disponível");
        return;
    }

    let d=hist[hist.length-1];

    relatorio.innerHTML=`
    <div class="relatorio" id="pdfContent">

    <div class="topo">
        <img class="logo" src="${d.logo || ''}">
        <div>
            <h2>${d.empresa}</h2>
            <p>Relatório Técnico</p>
        </div>
    </div>

    <div class="box"><b>ID:</b> ${d.id}</div>
    <div class="box"><b>Cliente:</b> ${d.cliente}</div>
    <div class="box"><b>Técnico:</b> ${d.tecnico}</div>

    <div class="box"><b>Início:</b> ${d.inicio}</div>
    <div class="box"><b>Fim:</b> ${d.fim}</div>

    <div class="box"><b>Observações:</b><br>${d.obs_inicio || ""}<br>${d.obs_fim || ""}</div>

    <h3>📸 Fotos</h3>
    <img src="${d.foto_inicio}">
    <img src="${d.foto_fim}">

    <h3>🎥 Vídeo</h3>
    <p>${d.video}</p>
    <div id="qrVideo" class="qr"></div>

    <h3>🔐 Autenticidade</h3>
    <div id="qrAuth" class="qr"></div>
    <p>${d.id}</p>

    </div>
    `;

    relatorio.style.display="block";

    // ESPERA RENDERIZAR
    setTimeout(()=>{

        new QRCode(document.getElementById("qrVideo"),{
            text:d.video || "sem video",
            width:120,
            height:120
        });

        new QRCode(document.getElementById("qrAuth"),{
            text:d.id,
            width:120,
            height:120
        });

        setTimeout(()=>{

            html2pdf().set({
                margin: 5,
                filename: 'relatorio.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(document.getElementById("pdfContent")).save();

            relatorio.style.display="none";

        }, 800);

    }, 300);
};

// WHATSAPP
zap.onclick=()=>{
    let hist=JSON.parse(localStorage.getItem("historico")||"[]");

    if(hist.length === 0){
        alert("Sem relatório");
        return;
    }

    let d=hist[hist.length-1];

    let msg=`Relatório ${d.id} - ${d.cliente}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
};
</script>

</body>
</html>

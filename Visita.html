<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check-in PRO MASTER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
/* Box sizing global para PDF mais consistente */
* {
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
}

input, textarea, button {
    width: 90%;
    padding: 12px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button { font-weight: bold; }
#start { background: green; }
#end { background: red; }
#pdf { background: blue; }

.relatorio {
    width: 794px; /* largura A4 fixa */
    background: #fff;
    color: #000;
    padding: 20px;
    box-sizing: border-box;
}

.topo { 
    display: flex; 
    align-items: center;   /* mantém logo e texto alinhados verticalmente */
    gap: 15px;             /* espaço entre logo e texto */
}

.logo {
    width: 70px;
    height: auto;
    object-fit: contain;
}

.grid { display:flex; gap:10px; margin:10px 0; }
.grid div { flex:1; background:#eee; padding:8px; border-radius:5px; }

.box { background:#eee; padding:10px; border-radius:5px; margin:10px 0; }

.fotos { display:flex; gap:10px; }
.fotos img { width:100%; max-height:220px; object-fit:cover; }

.carimbo {
    position:absolute;
    top:40%;
    left:20%;
    transform:rotate(-20deg);
    font-size:35px;
    color:rgba(0,150,0,0.2);
    border:3px solid rgba(0,150,0,0.2);
    padding:10px;
}

#qrs {
    display:flex;
    justify-content:center;
    margin:10px;
}
</style>
</head>

<body>

<h2>📍 Check-in PRO</h2>

<input id="empresa" placeholder="Empresa">
<input id="cliente" placeholder="Cliente">
<input id="tecnico" placeholder="Técnico">
<input id="video" placeholder="Link do vídeo">
<input type="file" id="logoInput">
<textarea id="obs" placeholder="Observações"></textarea>

<button id="start">INICIAR</button>
<button id="end">FINALIZAR</button>
<button id="pdf">GERAR PDF</button>

<input type="file" id="camera" hidden accept="image/*" capture="environment">
<div id="relatorio" style="display:none;"></div>

<script>

let dados = {};
let logoBase64 = "";

// LOGO
logoInput.onchange = e=>{
    let r=new FileReader();
    r.onload=ev=>logoBase64=ev.target.result;
    r.readAsDataURL(e.target.files[0]);
};

// GPS
function getLocation(){
    return new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(
            p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
            ()=>reject("Ative o GPS"),
            {enableHighAccuracy:true}
        );
    });
}

// COMPRESSÃO
function comprimir(base64){
    return new Promise(res=>{
        let img=new Image();
        img.onload=()=>{
            let canvas=document.createElement("canvas");
            let ctx=canvas.getContext("2d");

            let max=800;
            let scale=Math.min(max/img.width,max/img.height);

            canvas.width=img.width*scale;
            canvas.height=img.height*scale;

            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            res(canvas.toDataURL("image/jpeg",0.7));
        };
        img.src=base64;
    });
}

// FOTO
function tirarFoto(){
    return new Promise((resolve,reject)=>{
        camera.value = "";
        camera.click();

        camera.onchange = async ()=>{
            if (!camera.files || !camera.files[0]) {
                return reject("Foto cancelada");
            }

            let r = new FileReader();

            r.onload = async e=>{
                let img = await comprimir(e.target.result);
                resolve(img);
            };

            r.onerror = ()=> reject("Erro ao ler imagem");

            r.readAsDataURL(camera.files[0]);
        };
    });
}

// HASH
function gerarHash(d){
    let base = JSON.stringify(d) + navigator.userAgent;
    let hash=0;
    for(let i=0;i<base.length;i++){
        hash=((hash<<5)-hash)+base.charCodeAt(i);
        hash|=0;
    }
    return "CHK-"+Math.abs(hash);
}

// INICIAR
start.onclick = async ()=>{
    try{
        let loc = await getLocation();
        let foto = await tirarFoto();

        dados = {
            id:"REL-"+Date.now(),
            empresa:empresa.value,
            cliente:cliente.value,
            tecnico:tecnico.value,
            video:video.value,
            logo:logoBase64,
            inicio:new Date().toLocaleString(),
            lat_inicio:loc.lat,
            lng_inicio:loc.lng,
            foto_inicio:foto,
            obs_inicio:obs.value
        };

        localStorage.setItem("visita", JSON.stringify(dados));
        alert("✅ Iniciado");

    }catch(e){
        alert(e);
    }
};

// FINALIZAR
end.onclick = async ()=>{
    try{
        let d = JSON.parse(localStorage.getItem("visita") || "null");
        if(!d) return alert("Inicie primeiro");

        let loc = await getLocation();
        let foto = await tirarFoto();

        d.fim = new Date().toLocaleString();
        d.lat_fim = loc.lat;
        d.lng_fim = loc.lng;
        d.foto_fim = foto;
        d.obs_fim = obs.value;

        localStorage.setItem("final", JSON.stringify(d));

        alert("✅ Finalizado");

    }catch(e){
        alert(e);
    }
};

// PDF
pdf.onclick = async ()=>{
    let d;
    try{
        d = JSON.parse(localStorage.getItem("final"));
    }catch{
        d = null;
    }

    if(!d) return alert("Finalize primeiro");

    let hash = gerarHash(d);

    relatorio.innerHTML = `
    <div class="relatorio" id="pdfContent">

    <div class="topo">
        <img class="logo" src="${d.logo||''}">
        <div>
            <h2>${d.empresa}</h2>
            <p>RELATÓRIO TÉCNICO</p>
        </div>
    </div>

    <hr>

    <div class="grid">
        <div><b>ID:</b><br>${d.id}</div>
        <div><b>Cliente:</b><br>${d.cliente}</div>
        <div><b>Técnico:</b><br>${d.tecnico}</div>
    </div>

    <div class="grid">
        <div><b>Início:</b><br>${d.inicio}</div>
        <div><b>Fim:</b><br>${d.fim}</div>
    </div>

    <div class="box">
        ${d.obs_inicio ? `<b>Início:</b> ${d.obs_inicio}<br>` : ""}
        ${d.obs_fim ? `<b>Fim:</b> ${d.obs_fim}` : ""}
    </div>

    <h3>Fotos</h3>
    <div class="fotos">
        <img src="${d.foto_inicio}">
        <img src="${d.foto_fim}">
    </div>

    <h3>Localização</h3>
    <div class="box">
        <a href="https://maps.google.com/?q=${d.lat_inicio},${d.lng_inicio}">
        Ver início</a><br>
        <a href="https://maps.google.com/?q=${d.lat_fim},${d.lng_fim}">
        Ver fim</a>
    </div>

    <h3>Validação</h3>
    <div id="qrs"></div>

    <div class="box"><b>HASH:</b><br>${hash}</div>

    <div class="carimbo">✔ CONCLUÍDO</div>

    </div>
    `;

    relatorio.style.display="block";

    requestAnimationFrame(async ()=>{

        const qrContainer = document.getElementById("qrs");
        qrContainer.innerHTML = "";

        new QRCode(qrContainer,{
            text: `${d.id} | ${hash}`,
            width:120,
            height:120
        });

        await new Promise(r => setTimeout(r, 600));

        await document.fonts.ready;

        const el = document.getElementById("pdfContent");

        const opt = {
            margin: [10,10,10,10],
            filename: "relatorio.pdf",
            html2canvas: { scale: 3, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4' }
        };

        await html2pdf().set(opt).from(el).save();

        relatorio.style.display = "none";
    });
};

</script>

</body>
</html>

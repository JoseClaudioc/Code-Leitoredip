<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check-in PRO MASTER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 15px;
}

input, textarea {
    width: 90%;
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    width: 90%;
    padding: 14px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

#start { background: green; }
#end { background: red; }
#pdf { background: blue; }
#zap { background: #25D366; }

img { max-width: 100%; margin: 10px 0; }

.box {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
}
</style>
</head>

<body>

<h2>📍 Check-in PRO MASTER</h2>

<input id="empresa" placeholder="Empresa">
<input id="cliente" placeholder="Cliente">
<input id="tecnico" placeholder="Técnico">
<input id="video" placeholder="Link do vídeo">

<input type="file" id="logoInput" accept="image/*">

<textarea id="obs" placeholder="Observações"></textarea>

<button id="start">INICIAR</button>
<button id="end">FINALIZAR</button>
<button id="pdf">GERAR PDF PREMIUM</button>
<button id="zap">ENVIAR WHATSAPP</button>

<h3>📊 Histórico</h3>
<input id="busca" placeholder="Buscar cliente...">
<div id="historico"></div>

<input type="file" accept="image/*" capture="camera" id="camera" hidden>
<img id="preview">

<div id="relatorio" style="display:none;"></div>

<script>
// ELEMENTOS
const logoInput = document.getElementById("logoInput");
const start = document.getElementById("start");
const end = document.getElementById("end");
const pdf = document.getElementById("pdf");
const zap = document.getElementById("zap");
const camera = document.getElementById("camera");
const preview = document.getElementById("preview");
const historico = document.getElementById("historico");
const relatorio = document.getElementById("relatorio");
const busca = document.getElementById("busca");

const empresa = document.getElementById("empresa");
const cliente = document.getElementById("cliente");
const tecnico = document.getElementById("tecnico");
const video = document.getElementById("video");
const obs = document.getElementById("obs");

let logoBase64 = "";

// LOGO
logoInput.onchange = e => {
    let reader = new FileReader();
    reader.onload = ev => logoBase64 = ev.target.result;
    reader.readAsDataURL(e.target.files[0]);
};

// LOCALIZAÇÃO
function getLocation(cb){
    navigator.geolocation.getCurrentPosition(p=>{
        cb({lat:p.coords.latitude, lng:p.coords.longitude});
    });
}

// FOTO
function foto(cb){
    camera.click();
    camera.onchange = ()=>{
        let r = new FileReader();
        r.onload=e=>{
            preview.src=e.target.result;
            cb(e.target.result);
        };
        r.readAsDataURL(camera.files[0]);
    };
}

// INICIAR
start.onclick=()=>{
    if(!cliente.value){
        alert("Preencha o cliente");
        return;
    }

    getLocation(loc=>{
        foto(f=>{
            let dados={
                id:"REL-"+Date.now(),
                empresa:empresa.value,
                cliente:cliente.value,
                tecnico:tecnico.value,
                video:video.value,
                logo: logoBase64,
                inicio:new Date().toLocaleString(),
                lat:loc.lat,
                lng:loc.lng,
                foto_inicio:f,
                obs_inicio:obs.value
            };
            localStorage.setItem("visita",JSON.stringify(dados));
            alert("Iniciado");
        });
    });
};

// FINALIZAR
end.onclick=()=>{
    let d=JSON.parse(localStorage.getItem("visita"));
    if(!d){
        alert("Você precisa iniciar primeiro");
        return;
    }

    getLocation(loc=>{
        foto(f=>{
            d.fim=new Date().toLocaleString();
            d.foto_fim=f;
            d.obs_fim=obs.value;

            let hist=JSON.parse(localStorage.getItem("historico")||"[]");
            hist.push(d);
            localStorage.setItem("historico",JSON.stringify(hist));

            renderHist();
            alert("Finalizado");
        });
    });
};

// HISTÓRICO
function renderHist(filtro=""){
    let hist=JSON.parse(localStorage.getItem("historico")||"[]");
    historico.innerHTML="";

    hist.slice().reverse().forEach(h=>{
        if(h.cliente.toLowerCase().includes(filtro.toLowerCase())){
            historico.innerHTML+=`
            <div class="box">
            ${h.cliente} - ${h.inicio}
            </div>`;
        }
    });
}

busca.oninput = () => renderHist(busca.value);
renderHist();

// PDF PROFISSIONAL
pdf.onclick = async () => {

    let hist = JSON.parse(localStorage.getItem("historico"));
    if(!hist || hist.length === 0){
        alert("Sem relatórios");
        return;
    }

    let d = hist[hist.length - 1];

    relatorio.innerHTML = `
    <div style="font-family: Arial; color:#000; padding:25px;">

        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000;">
            <img src="${d.logo}" style="width:80px;">
            <div style="text-align:right;">
                <h2>${d.empresa || "Empresa"}</h2>
                <small>${d.id}</small>
            </div>
        </div>

        <h3>Dados</h3>
        <p><b>Cliente:</b> ${d.cliente}</p>
        <p><b>Técnico:</b> ${d.tecnico}</p>
        <p><b>Início:</b> ${d.inicio}</p>
        <p><b>Fim:</b> ${d.fim}</p>

        <h3>Localização</h3>
        <p>${d.lat}, ${d.lng}</p>
        <a href="https://maps.google.com/?q=${d.lat},${d.lng}">Abrir no mapa</a>
        <div id="qrMapa"></div>

        <h3>Observações</h3>
        <p>${d.obs_inicio || ""}<br>${d.obs_fim || ""}</p>

        <h3>Fotos</h3>
        <img src="${d.foto_inicio}" style="width:100%; max-height:250px; object-fit:cover;">
        <img src="${d.foto_fim}" style="width:100%; max-height:250px; object-fit:cover;">

        <h3>Vídeo</h3>
        <p>${d.video}</p>
        <div id="qrVideo"></div>

    </div>
    `;

    relatorio.style.display = "block";

    new QRCode(document.getElementById("qrVideo"),{
        text:d.video || "sem-video",
        width:100,
        height:100
    });

    new QRCode(document.getElementById("qrMapa"),{
        text:`https://maps.google.com/?q=${d.lat},${d.lng}`,
        width:100,
        height:100
    });

    await new Promise(r => setTimeout(r, 1000));

    await html2pdf().set({
        margin: 8,
        filename: `Relatorio_${d.cliente}.pdf`,
        image: { type: 'jpeg', quality: 0.85 },
        html2canvas: { scale: 1.5 },
        jsPDF: { unit: 'mm', format: 'a4' }
    }).from(relatorio).save();

    relatorio.style.display = "none";
};

// WHATSAPP
zap.onclick=()=>{
    let hist=JSON.parse(localStorage.getItem("historico"));
    if(!hist || hist.length===0){
        alert("Sem dados");
        return;
    }

    let d=hist[hist.length-1];

    let msg=`Relatório ${d.id}
Cliente: ${d.cliente}
Mapa: https://maps.google.com/?q=${d.lat},${d.lng}`;

    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
};
</script>

</body>
</html>

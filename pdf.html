<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Profissional de Documentos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.container{
background:white;
padding:25px;
max-width:1100px;
margin:auto;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

input,textarea,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#007BFF;
color:white;
padding:12px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
page-break-inside:auto;
}

tr{
page-break-inside:avoid;
break-inside:avoid;
}

td,th{
border:1px solid #ddd;
padding:8px;
}

th{
background:#f2f2f2;
}

.removeBtn{
background:red;
color:white;
}

.total{
font-size:24px;
font-weight:bold;
}

/* PDF AREA */

#pdf{
background:white;
width:210mm;
padding:20mm;
padding-bottom:35mm;
margin:auto;
box-sizing:border-box;
position:relative;
}

#pdf *{
page-break-inside:avoid;
}

thead{
display:table-header-group;
}

tfoot{
display:table-footer-group;
}

.header{
display:flex;
align-items:center;
gap:20px;
border-bottom:3px solid #007BFF;
padding-bottom:12px;
margin-bottom:20px;
position:relative;
z-index:5;
}

.logo{
width:90px;
}

.headerInfo h1{
margin:0;
font-size:20px;
}

.headerInfo p{
margin:2px 0;
font-size:13px;
color:#444;
}

.tituloDocumento{
text-align:center;
font-size:24px;
margin:20px 0;
font-weight:bold;
}

img{
max-width:100%;
}

.watermark{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:350px;
opacity:0.05;
z-index:0;
pointer-events:none;
}

.rodape{
margin-top:40px;
text-align:center;
font-size:11px;
color:#444;
}

h1,h2,h3,h4,h5,p,table,img{
page-break-inside:avoid;
}

</style>
</head>

<body>

<div class="container">

<h2>Gerador de Documentos</h2>

<select id="tipoDoc">
<option>Orçamento</option>
<option>Proposta</option>
<option>Ordem de Serviço</option>
<option>Contrato</option>
<option>Relatório</option>
<option>Recibo</option>
</select>

<h3>Empresa</h3>

<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email">
<input type="file" id="logoUpload">

<h3>Cliente</h3>

<input id="cliente" placeholder="Cliente">

<label>Descrição</label>
<textarea id="descricao"></textarea>

<label>Observações</label>
<textarea id="obs"></textarea>

<h3>Itens</h3>

<button onclick="addItem()">Adicionar Item</button>

<table id="tabelaItens">
<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
<th></th>
</tr>
</table>

<h3>QR Code</h3>

<input id="link" placeholder="Link para QR Code">
<button onclick="gerarQR()">Gerar QR Code</button>

<div id="qrcode"></div>

<br><br>

<button onclick="gerarPDF()">Gerar PDF</button>

<hr>

<div id="pdf">

<img id="watermark" class="watermark">

<div class="header">

<img id="logoImg" class="logo">

<div class="headerInfo">

<h1 id="tituloEmpresa"></h1>

<p id="dadosEmpresa"></p>

<p id="numeroDoc"></p>

<p id="dataDoc"></p>

</div>

</div>

<div class="tituloDocumento" id="tituloDoc"></div>

<table>

<tr>
<th>Cliente</th>
<td id="pdfCliente"></td>
</tr>

</table>

<h3>Itens</h3>

<table id="pdfItens">

<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
</tr>

</table>

<h3>Descrição</h3>

<p id="pdfDescricao"></p>

<h3>Observações</h3>

<p id="pdfObs"></p>

<div style="text-align:right">

<h2>TOTAL</h2>

<p class="total" id="pdfTotal"></p>

</div>

<hr>

<div>

<b>Contato</b>

<p id="pdfContato"></p>

<p id="pdfEmail"></p>

<br>

<img id="qrImg" width="120">

</div>

<div class="rodape">

Documento gerado eletronicamente

</div>

</div>

</div>

<script>

let qrBase64="";

function moedaBR(v){
return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function parseBR(v){
if(!v) return 0;
v=v.replace(/[R$\s]/g,"").replace(/\./g,"").replace(",",".");
return parseFloat(v)||0;
}

function addItem(){
let linha=document.getElementById("tabelaItens").insertRow();
linha.innerHTML=`
<td><input></td>
<td><input></td>
<td><input class="valor"></td>
<td><button class="removeBtn" onclick="removerItem(this)">X</button></td>
`;
}

function removerItem(btn){
btn.parentNode.parentNode.remove();
}

function gerarNumeroDocumento(){
let seq=localStorage.getItem("seqDoc") || 1;
let ano=new Date().getFullYear();
let numero="DOC-"+ano+"-"+String(seq).padStart(6,"0");
localStorage.setItem("seqDoc",Number(seq)+1);
return numero;
}

function gerarQR(){
let link=document.getElementById("link").value;
let container=document.getElementById("qrcode");
container.innerHTML="";

new QRCode(container,{
text:link,
width:120,
height:120
});

setTimeout(()=>{
let canvas=container.querySelector("canvas");
if(canvas) qrBase64=canvas.toDataURL("image/png");
},300);
}

document.getElementById("logoUpload").addEventListener("change",function(){
let reader=new FileReader();
reader.onload=function(e){
document.getElementById("logoImg").src=e.target.result;
document.getElementById("watermark").src=e.target.result;
}
reader.readAsDataURL(this.files[0]);
});

function gerarPDF(){

const tipoDoc=document.getElementById("tipoDoc").value;
const empresa=document.getElementById("empresa").value;
const cliente=document.getElementById("cliente").value;

document.getElementById("tituloDoc").innerText=tipoDoc;
document.getElementById("tituloEmpresa").innerText=empresa;
document.getElementById("dadosEmpresa").innerText="CNPJ: "+document.getElementById("cnpj").value;
document.getElementById("numeroDoc").innerText="Documento Nº "+gerarNumeroDocumento();
document.getElementById("dataDoc").innerText=new Date().toLocaleDateString("pt-BR");
document.getElementById("pdfCliente").innerText=cliente;
document.getElementById("pdfDescricao").innerText=document.getElementById("descricao").value;
document.getElementById("pdfObs").innerText=document.getElementById("obs").value;
document.getElementById("pdfContato").innerText=document.getElementById("telefone").value;
document.getElementById("pdfEmail").innerText=document.getElementById("email").value;
document.getElementById("qrImg").src=qrBase64;

let tabelaPDF=document.getElementById("pdfItens");

tabelaPDF.innerHTML=`<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
</tr>`;

let total=0;

const linhas=document.querySelectorAll("#tabelaItens tr:not(:first-child)");

linhas.forEach(linha=>{

const inputs=linha.querySelectorAll("input");

let item=inputs[0].value;
let desc=inputs[1].value;
let valor=parseBR(inputs[2].value);

if(!item && !desc && !valor) return;

let nova=tabelaPDF.insertRow();

nova.innerHTML=`<td>${item}</td><td>${desc}</td><td>${moedaBR(valor)}</td>`;

total+=valor;

});

document.getElementById("pdfTotal").innerText=moedaBR(total);

const elemento=document.getElementById("pdf");

html2pdf().set({

margin:[5,10,20,10],

filename:tipoDoc+"_"+cliente+".pdf",

image:{type:"jpeg",quality:1},

html2canvas:{
scale:2,
useCORS:true,
scrollY:0
},

jsPDF:{
unit:"mm",
format:"a4",
orientation:"portrait"
},

pagebreak:{
mode:['css','legacy']
}

}).from(elemento).save();

}

</script>

</body>
</html>

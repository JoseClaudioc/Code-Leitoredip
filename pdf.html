<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Profissional de Documentos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

/* ===== Estilos gerais ===== */
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:20px;
}

.container{
  background:white;
  padding:25px;
  max-width:1100px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,0.1);
}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  background:#007BFF;
  color:white;
  padding:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#0056b3;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  page-break-inside:auto;
}

tr{
  page-break-inside:avoid;
}

td,th{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#f2f2f2;
}

.removeBtn{
  background:red;
  color:white;
}

.total{
  font-size:24px;
  font-weight:bold;
}

/* ===== AREA DO PDF ===== */
#pdf{
  width:170mm; /* 210mm total - 20mm padding esquerdo/direito */
  min-height:297mm;
  padding:20mm;
  margin:auto;
  box-sizing:border-box;
  position:relative;
  background:white;
}

.header{
  display:flex;
  align-items:center;
  gap:20px;
  border-bottom:3px solid #007BFF;
  padding-bottom:12px;
  margin-bottom:20px;
}

.logo{
  width:90px;
}

.headerInfo h1{
  margin:0;
  font-size:20px;
}

.headerInfo p{
  margin:2px 0;
  font-size:13px;
  color:#444;
}

.tituloDocumento{
  text-align:center;
  font-size:24px;
  margin:20px 0;
  font-weight:bold;
}

img{
  max-width:100%;
}

.watermark{
  position:absolute;
  top:40%;
  left:25%;
  width:400px;
  opacity:0.05;
}

.rodape{
  position:absolute;
  bottom:15mm;
  left:20mm;
  right:20mm;
  text-align:center;
  font-size:11px;
  color:#444;
}

/* ===== Textareas maiores ===== */
#descricao, #obs {
  min-height:120px;
  resize: vertical;
}

/* ===== Responsividade ===== */
@media (max-width: 768px) {

  table, thead, tbody, th, td, tr {
    display: block;
    width: 100%;
  }

  th {
    text-align: left;
    background: #f2f2f2;
    padding: 6px;
  }

  td {
    padding: 6px;
    text-align: left;
    border: none;
    border-bottom: 1px solid #ddd;
    position: relative;
  }

  td::before {
    content: attr(data-label);
    font-weight: bold;
    display: inline-block;
    width: 100px;
  }

  .removeBtn {
    width: 100%;
    margin-top: 5px;
  }

  input, textarea {
    width: 100%;
    box-sizing: border-box;
  }

}

</style>
</head>

<body>

<div class="container">

<h2>Gerador de Documentos</h2>

<select id="tipoDoc">
<option>Orçamento</option>
<option>Proposta</option>
<option>Ordem de Serviço</option>
<option>Contrato</option>
<option>Relatório</option>
<option>Recibo</option>
</select>

<h3>Empresa</h3>

<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email">
<input type="file" id="logoUpload">

<h3>Cliente</h3>

<input id="cliente" placeholder="Cliente">

<label>Descrição</label>
<textarea id="descricao"></textarea>

<label>Observações</label>
<textarea id="obs"></textarea>

<h3>Itens</h3>

<button onclick="addItem()">Adicionar Item</button>

<table id="tabelaItens">
<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
<th></th>
</tr>
</table>

<h3>QR Code</h3>

<input id="link" placeholder="Link para QR Code">
<button onclick="gerarQR()">Gerar QR Code</button>

<div id="qrcode"></div>

<br><br>

<button onclick="gerarPDF()">Gerar PDF</button>

<hr>

<!-- AREA DO PDF -->

<div id="pdf">

<img id="watermark" class="watermark">

<div class="header">

<img id="logoImg" class="logo">

<div class="headerInfo">

<h1 id="tituloEmpresa"></h1>

<p id="dadosEmpresa"></p>

<p id="numeroDoc"></p>

<p id="dataDoc"></p>

</div>

</div>

<div class="tituloDocumento" id="tituloDoc"></div>

<table>

<tr>
<th>Cliente</th>
<td id="pdfCliente"></td>
</tr>

</table>

<h3>Itens</h3>

<table id="pdfItens">
<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
</tr>
</table>

<h3>Descrição</h3>

<p id="pdfDescricao"></p>

<h3>Observações</h3>

<p id="pdfObs"></p>

<div style="text-align:right">
<h2>TOTAL</h2>
<p class="total" id="pdfTotal"></p>
</div>

<hr>

<div>
<b>Contato</b>
<p id="pdfContato"></p>
<p id="pdfEmail"></p>
<br>
<img id="qrImg" width="120">
</div>

<div class="rodape">
Documento gerado eletronicamente
</div>

</div>

</div>

<script>

let qrBase64="";

function moedaBR(v){
  return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function parseBR(v){
  if(!v) return 0;
  v=v.replace(/[R$\s]/g,"").replace(/\./g,"").replace(",",".");
  return parseFloat(v)||0;
}

function addItem(){
  let linha=document.getElementById("tabelaItens").insertRow();
  linha.innerHTML=`
  <td data-label="Item"><input></td>
  <td data-label="Descrição"><input></td>
  <td data-label="Valor"><input class="valor"></td>
  <td data-label="Ação"><button class="removeBtn" onclick="removerItem(this)">X</button></td>
  `;
}

function removerItem(btn){
  btn.parentNode.parentNode.remove();
}

function calcularTotal(){
  let total=0;
  document.querySelectorAll(".valor").forEach(v=>{
    total+=parseBR(v.value);
  });
  return total;
}

function gerarNumeroDocumento(){
    let numero = Math.floor(100000 + Math.random() * 900000);
    return numero;
}

function gerarQR(){
  let link=document.getElementById("link").value;
  if(!link){
    alert("Informe um link");
    return;
  }
  let container=document.getElementById("qrcode");
  container.innerHTML="";
  new QRCode(container,{
    text:link,
    width:120,
    height:120
  });
  setTimeout(()=>{
    let canvas=container.querySelector("canvas");
    if(canvas) qrBase64=canvas.toDataURL("image/png");
  },300);
}

document.getElementById("logoUpload").addEventListener("change",function(){
  let reader=new FileReader();
  reader.onload=function(e){
    document.getElementById("logoImg").src=e.target.result;
    document.getElementById("watermark").src=e.target.result;
  }
  reader.readAsDataURL(this.files[0]);
});

function adicionarNumeracao(pdf){
  let total=pdf.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    pdf.setPage(i);
    pdf.setFontSize(9);
    pdf.text(
      "Página "+i+" de "+total,
      pdf.internal.pageSize.getWidth()-40,
      pdf.internal.pageSize.getHeight()-10
    );
  }
}

function gerarPDF(){
  const tipoDoc=document.getElementById("tipoDoc").value;
  const empresa=document.getElementById("empresa").value;
  const cliente=document.getElementById("cliente").value;

  if(!empresa || !cliente){
    alert("Preencha empresa e cliente");
    return;
  }

  document.getElementById("tituloDoc").innerText=tipoDoc;
  document.getElementById("tituloEmpresa").innerText=empresa;
  document.getElementById("dadosEmpresa").innerText="CNPJ: "+document.getElementById("cnpj").value;
  document.getElementById("numeroDoc").innerText="Protocolo Nº "+gerarNumeroDocumento();
  document.getElementById("dataDoc").innerText=new Date().toLocaleDateString("pt-BR");
  document.getElementById("pdfCliente").innerText=cliente;
  document.getElementById("pdfDescricao").innerText=document.getElementById("descricao").value;
  document.getElementById("pdfObs").innerText=document.getElementById("obs").value;
  document.getElementById("pdfContato").innerText=document.getElementById("telefone").value;
  document.getElementById("pdfEmail").innerText=document.getElementById("email").value;
  document.getElementById("qrImg").src=qrBase64;

  let tabelaPDF=document.getElementById("pdfItens");
  tabelaPDF.innerHTML=`<tr>
  <th>Item</th>
  <th>Descrição</th>
  <th>Valor</th>
  </tr>`;

  let total=0;
  const linhas=document.querySelectorAll("#tabelaItens tr:not(:first-child)");
  linhas.forEach(linha=>{
    const inputs=linha.querySelectorAll("input");
    let item=inputs[0].value;
    let desc=inputs[1].value;
    let valor=parseBR(inputs[2].value);
    if(!item && !desc && !valor) return;
    let nova=tabelaPDF.insertRow();
    nova.innerHTML=`<td>${item}</td><td>${desc}</td><td>${moedaBR(valor)}</td>`;
    total+=valor;
  });

  document.getElementById("pdfTotal").innerText=moedaBR(total);

  const elemento=document.getElementById("pdf");

  html2pdf().set({
    margin: [20,20,20,20],
    filename: tipoDoc+"_"+cliente+".pdf",
    image:{type:"jpeg",quality:1},
    html2canvas:{scale:3,scrollY:0},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
    pagebreak:{mode:['css','legacy','avoid-all']}
  })
  .from(elemento)
  .toPdf()
  .get('pdf')
  .then(function(pdf){
    adicionarNumeracao(pdf);
    pdf.save(tipoDoc+"_"+cliente+".pdf");
  });

}

</script>

</body>
</html>

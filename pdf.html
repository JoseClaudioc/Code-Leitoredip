<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Profissional de Documentos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#0b3d91;
  padding:20px;
}

.container{
  background:#1e5ed6;
  padding:25px;
  max-width:1100px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
  color:white;
}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
  background:white;
  color:black;
}

button{
  background:#0a58ca;
  color:white;
  padding:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#084298;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  page-break-inside:auto;
}

tr{
  page-break-inside:avoid;
}

td,th{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#0a58ca;
  color:white;
}

.removeBtn{
  background:red;
  color:white;
}

.total{
  font-size:24px;
  font-weight:bold;
}

.statusBox{
  font-weight:bold;
  padding:8px;
  border-radius:6px;
  text-align:center;
  color:white;
}

.status-pendente{ background:orange; }
.status-aprovado{ background:green; }
.status-rejeitado{ background:red; }
.status-analise{ background:blue; }


/* ===== PDF CORRIGIDO ===== */

#pdf{
  width:190mm; /* largura ajustada para evitar corte */
  min-height:297mm;
  padding:10mm;
  margin:auto;
  box-sizing:border-box;
  position:relative;
  background:white;
  color:black;
  overflow:visible; /* corrige corte à direita */
}

.header{
  display:flex;
  align-items:center;
  gap:20px;
  border-bottom:3px solid #0a58ca;
  padding-bottom:12px;
  margin-bottom:20px;
}

.logo{
  width:90px;
}

.headerInfo h1{
  margin:0;
  font-size:20px;
}

.headerInfo p{
  margin:2px 0;
  font-size:13px;
  color:#444;
}

.tituloDocumento{
  text-align:center;
  font-size:24px;
  margin:20px 0;
  font-weight:bold;
}

img{
  max-width:100%;
}

.watermark{
  position:absolute;
  top:40%;
  left:25%;
  width:400px;
  opacity:0.05;
}

.rodape{
  position:relative;
  margin-top:20px;
  text-align:center;
  font-size:11px;
  color:#444;
}


#descricao, #obs {
  min-height:120px;
  resize: vertical;
}

</style>
</head>

<body>

<div id="licencaTela" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0b3d91;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:white;
padding:30px;
border-radius:10px;
text-align:center;
width:300px;
">

<h3>Ativação do Sistema</h3>

<input type="password" id="senhaLicenca" placeholder="Digite a licença">
<br><br>
<button onclick="verificarLicenca()">Ativar</button>
<p id="erroLicenca" style="color:red;"></p>

</div>
</div>

<div class="container">

<h2>Gerador de Documentos</h2>

<select id="tipoDoc">
<option>Orçamento</option>
<option>Proposta</option>
<option>Ordem de Serviço</option>
<option>Contrato</option>
<option>Relatório</option>
<option>Recibo</option>
<option>Laudos</option>
<option>Visita Técnica</option>
</select>

<h3>Status</h3>
<select id="status">
<option value="pendente">Pendente</option>
<option value="Em Análise">Em Análise</option>
<option value="aprovado">Aprovado</option>
<option value="rejeitado">Rejeitado</option>
</select>

<h3>Empresa</h3>

<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email">
<input type="file" id="logoUpload">

<h3>Cliente</h3>

<input id="cliente" placeholder="Cliente">

<label>Descrição</label>
<textarea id="descricao"></textarea>

<label>Observações</label>
<textarea id="obs"></textarea>

<h3>Itens</h3>

<button onclick="addItem()">Adicionar Item</button>

<table id="tabelaItens">
<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
<th></th>
</tr>
</table>

<h3>QR Code</h3>

<input id="link" placeholder="Link para QR Code">

<button onclick="gerarQR()">Gerar QR Code</button>

<div id="qrcode"></div>

<br><br>

<button onclick="gerarPDF()">Gerar PDF</button>

<hr>

<div id="pdf">

<img id="watermark" class="watermark">

<div class="header">

<img id="logoImg" class="logo">

<div class="headerInfo">

<h1 id="tituloEmpresa"></h1>

<p id="dadosEmpresa"></p>

<p id="numeroDoc"></p>

<p id="dataDoc"></p>

</div>

</div>

<div class="tituloDocumento" id="tituloDoc"></div>

<table>

<tr>
<th>Cliente</th>
<td id="pdfCliente"></td>
</tr>

<tr>
<th>Status</th>
<td id="pdfStatus" class="statusBox"></td>
</tr>

</table>

<h3>Itens</h3>

<table id="pdfItens">

<tr>
<th>Item</th>
<th>Descrição</th>
<th>Valor</th>
</tr>

</table>

<h3>Descrição</h3>

<p id="pdfDescricao"></p>

<h3>Observações</h3>

<p id="pdfObs"></p>

<div style="text-align:right">

<h2>TOTAL</h2>

<p class="total" id="pdfTotal"></p>

</div>

<hr>

<div>

<b>Contato</b>

<p id="pdfContato"></p>

<p id="pdfEmail"></p>

<br>

<img id="qrImg" width="120">

</div>

<div class="rodape">
Documento gerado eletronicamente
</div>

</div>

</div>

<script>
const licencasValidas = [
  {
    codigo: "MTIzNDU2",

    vencimento: "31/12/2027"
  },
  {
    codigo: "Nzg5MTAxMQ==",

    vencimento: "30/06/2027"
  },
  {
    codigo: "YWJjZDEyMzQ=",

    vencimento: "31/01/2027"
  }
];


function verificarLicenca(){

  let senha = document.getElementById("senhaLicenca").value;

  let licenca = licencasValidas.find(l => atob(l.codigo) === senha);
;



  if(licenca){

    let partes = licenca.vencimento.split("/");
    let dataVenc = new Date(
      partes[2],
      partes[1]-1,
      partes[0]
    );

    let hoje = new Date();

    if(hoje <= dataVenc){

      document.getElementById("licencaTela").style.display="none";

    } else {

      document.getElementById("erroLicenca").innerText =
      "Licença vencida em " + licenca.vencimento;

    }

  } else {

    document.getElementById("erroLicenca").innerText =
    "Licença inválida";

  }

}



let qrBase64="";

function moedaBR(v){
  return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function parseBR(v){
  if(!v) return 0;
  v=v.replace(/[R$\s]/g,"").replace(/\./g,"").replace(",",".");
  return parseFloat(v)||0;
}

function addItem(){
  let linha=document.getElementById("tabelaItens").insertRow();
  linha.innerHTML=`
  <td><input></td>
  <td><input></td>
  <td><input class="valor"></td>
  <td><button class="removeBtn" onclick="removerItem(this)">X</button></td>
  `;
}

function removerItem(btn){
  btn.parentNode.parentNode.remove();
}

function gerarNumeroDocumento(){
  return Math.floor(100000 + Math.random() * 900000);
}

function gerarQR(){
  let link=document.getElementById("link").value;
  if(!link){ alert("Informe um link"); return; }
  let container=document.getElementById("qrcode");
  container.innerHTML="";
  new QRCode(container,{
    text:link,
    width:120,
    height:120,
    correctLevel:QRCode.CorrectLevel.H
  });
  setTimeout(()=>{
    let canvas=container.querySelector("canvas");
    if(canvas) qrBase64=canvas.toDataURL("image/png");
  },300);
}

document.getElementById("logoUpload").addEventListener("change",function(){
  let reader=new FileReader();
  reader.onload=function(e){
    document.getElementById("logoImg").src=e.target.result;
    document.getElementById("watermark").src=e.target.result;
  }
  reader.readAsDataURL(this.files[0]);
});

function gerarPDF(){

  const tipoDoc=document.getElementById("tipoDoc").value;
  const empresa=document.getElementById("empresa").value;
  const cliente=document.getElementById("cliente").value;

  document.getElementById("tituloDoc").innerText=tipoDoc;
  document.getElementById("tituloEmpresa").innerText=empresa;
  document.getElementById("dadosEmpresa").innerText="CNPJ: "+document.getElementById("cnpj").value;
  document.getElementById("numeroDoc").innerText="Protocolo Nº "+gerarNumeroDocumento();
  document.getElementById("dataDoc").innerText=new Date().toLocaleDateString("pt-BR");
  document.getElementById("pdfCliente").innerText=cliente;

  const status = document.getElementById("status").value;
  const statusEl = document.getElementById("pdfStatus");

  statusEl.className = "statusBox";

  if(status === "pendente"){
    statusEl.classList.add("status-pendente");
    statusEl.innerText = "PENDENTE";
  }
  if(status === "Em Análise"){
    statusEl.classList.add("status-analise");

;
    statusEl.innerText = "EM ANÁLISE";
  }
  if(status === "aprovado"){
    statusEl.classList.add("status-aprovado");
    statusEl.innerText = "APROVADO";
  }
  if(status === "rejeitado"){
    statusEl.classList.add("status-rejeitado");
    statusEl.innerText = "REJEITADO";
  }

  document.getElementById("pdfDescricao").innerText=document.getElementById("descricao").value;
  document.getElementById("pdfObs").innerText=document.getElementById("obs").value;
  document.getElementById("pdfContato").innerText=document.getElementById("telefone").value;
  document.getElementById("pdfEmail").innerText=document.getElementById("email").value;
  document.getElementById("qrImg").src=qrBase64;

  let tabelaPDF=document.getElementById("pdfItens");
  tabelaPDF.innerHTML=`<tr>
  <th>Item</th>
  <th>Descrição</th>
  <th>Valor</th>
  </tr>`;

  let total=0;

  const linhas=document.querySelectorAll("#tabelaItens tr:not(:first-child)");

  linhas.forEach(linha=>{
    const inputs=linha.querySelectorAll("input");
    let item=inputs[0].value;
    let desc=inputs[1].value;
    let valor=parseBR(inputs[2].value);

    let nova=tabelaPDF.insertRow();
    nova.innerHTML=`<td>${item}</td><td>${desc}</td><td>${moedaBR(valor)}</td>`;
    total+=valor;
  });

  document.getElementById("pdfTotal").innerText=moedaBR(total);

  const elemento=document.getElementById("pdf");

  setTimeout(() => {

  html2pdf().set({
    margin: [10,10,10,10],
    filename: tipoDoc+"_"+cliente+".pdf",
    image:{type:"jpeg",quality:1},
    html2canvas:{
      scale:2,
      scrollY:0,
      useCORS:true
    },
    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    }
  })
  .from(elemento)
  .save();

}, 800);


}
const empresa = document.getElementById("empresa");

// Carrega o último valor salvo
empresa.value = localStorage.getItem("empresa") || "";

// Salva automaticamente quando o valor mudar
empresa.addEventListener("input", function () {
    localStorage.setItem("empresa", empresa.value);
});

const cnpj = document.getElementById("cnpj");

cnpj.value = localStorage.getItem("cnpj") || "";

cnpj.addEventListener("input", function () {
    localStorage.setItem("cnpj", cnpj.value);
});
const telefone = document.getElementById("telefone");

telefone.value = localStorage.getItem("telefone") || "";

telefone.addEventListener("input", function () {
    localStorage.setItem("telefone", telefone.value);
});
const email = document.getElementById("email");

email.value = localStorage.getItem("email") || "";

email.addEventListener("input", function () {
    localStorage.setItem("email", email.value);
});
const cliente = document.getElementById("cliente");

cliente.value = localStorage.getItem("cliente") || "";

cliente.addEventListener("input", function () {
    localStorage.setItem("cliente", cliente.value);
});
const descricao = document.getElementById("descricao");

descricao.value = localStorage.getItem("descricao") || "";

descricao.addEventListener("input", function () {
    localStorage.setItem("descricao", descricao.value);
});
const obs = document.getElementById("obs");

obs.value = localStorage.getItem("obs") || "";

obs.addEventListener("input", function () {
    localStorage.setItem("obs", obs.value);
});
const link = document.getElementById("link");

link.value = localStorage.getItem("link") || "";

link.addEventListener("input", function () {
    localStorage.setItem("link", link.value);
});
const tipoDoc = document.getElementById("tipoDoc");

tipoDoc.value = localStorage.getItem("tipoDoc") || "Orçamento";

tipoDoc.addEventListener("change", function () {
    localStorage.setItem("tipoDoc", tipoDoc.value);
});
const status = document.getElementById("status");

status.value = localStorage.getItem("status") || "pendente";

status.addEventListener("change", function () {
    localStorage.setItem("status", status.value);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    background:#1a0000;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding-bottom:40px
}
h2{margin-top:20px}

#reader{
    width:350px;
    margin:20px auto;
    border:4px solid #ff0000;
    border-radius:12px
}
.btn{
    background:#ff0000;
    color:#fff;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    margin:8px auto;
    width:90%;
    cursor:pointer
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}
#msgPop{
    display:none;
    position:fixed;
    top:-60px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    background:#ff4444;
    color:#fff;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
    z-index:9999;
    opacity:0;
    transition:all .5s ease
}
#msgPop.show{top:20px;opacity:1}
#msgPop.green{background:#00ff88;color:#003300}
#msgPop.yellow{background:#ffaa00;color:#330000}

#history{margin-top:20px;padding:10px}
.badge{
    display:inline-block;
    margin:5px;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
    background:#330000;
    border:1px solid #ff4444
}
.badge.valid{background:#003314;border-color:#00ff88}

#counters{margin-top:10px}
.counter-box{
    background:#330000;
    border:2px solid #ff0000;
    padding:8px 12px;
    border-radius:10px;
    font-size:15px;
    margin:4px;
    display:inline-block
}
.portaria-box{
    margin-top:10px;
    font-size:18px;
    font-weight:bold
}
</style>
</head>

<body>

<h2>📡 ESIP - Sistemas</h2>

<div class="portaria-box">
    🚪 Portaria: <span id="portariaAtual">A</span>
</div>

<div id="counters">
    <div class="counter-box">Válidos: <span id="countValid">0</span></div>
    <div class="counter-box">Usados: <span id="countUsed">0</span></div>
    <div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
    <div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>

<input id="novaPortaria" placeholder="➕ Nova Portaria (ex: A, VIP)">
<button id="addPortaria" class="btn">➕ Adicionar Portaria</button>

<button id="reset" class="btn">🗑️ Resetar Ingressos</button>

<div id="msgPop"></div>

<h3>📜 Histórico</h3>
<div id="history"></div>

<script>
/* ================== CONSTANTES ================== */
const STORAGE_USED_KEY="usedCodesMap_v1";
const STORAGE_PORTARIA="portariaAtual";
const STORAGE_PORTARIAS="listaPortarias";
const STORAGE_COUNT_VALID="countValid";
const STORAGE_COUNT_USED="countUsed";
const STORAGE_COUNT_INVALID="countInvalid";

/* ================== ESTADO ================== */
let portarias=JSON.parse(localStorage.getItem(STORAGE_PORTARIAS))||["A","B","C"];
let portaria=localStorage.getItem(STORAGE_PORTARIA)||portarias[0];
portariaAtual.textContent=portaria;

let usedMap=JSON.parse(localStorage.getItem(STORAGE_USED_KEY))||{};
let totalValid=+localStorage.getItem(STORAGE_COUNT_VALID)||0;
let totalUsed=+localStorage.getItem(STORAGE_COUNT_USED)||0;
let totalInvalid=+localStorage.getItem(STORAGE_COUNT_INVALID)||0;

let html5Qr, cameras=[], currentCam=0, scanning=true;
let lastCode="", lastTime=0;
let flashOn=false;

/* ================== SONS ================== */
const sValid=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const sInvalid=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const sWarning=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const sFlashOn=new Audio("https://actions.google.com/sounds/v1/cartoon/slide_whistle_to_drum_hit.ogg");
const sFlashOff=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

/* ================== FUNÇÕES ================== */
function updateCounters(){
    countValid.textContent=totalValid;
    countUsed.textContent=totalUsed;
    countInvalid.textContent=totalInvalid;
    countMemory.textContent=Object.keys(usedMap).length;
}
updateCounters();

function showPopup(text,type){
    msgPop.textContent=text;
    msgPop.className="show";
    if(type===true) msgPop.classList.add("green");
    else if(type==="warn") msgPop.classList.add("yellow");

    (type===true?sValid:type===false?sInvalid:sWarning).play();
    msgPop.style.display="block";

    setTimeout(()=>{msgPop.className="";msgPop.style.display="none"},2500);
}

function validateCode(code){
    code=code.trim();
    if(!code.startsWith("ID:")) return false;
    const p=code.replace("ID:","").trim().split("-INGR-");
    return p.length===2 && p[0]===portaria;
}

function processQR(text){
    if(!scanning) return;
    scanning=false;

    const now=Date.now();
    if(text===lastCode && now-lastTime<3000){
        scanning=true;return;
    }
    lastCode=text;lastTime=now;

    if(!validateCode(text)){
        totalInvalid++;
        showPopup("❌ QR inválido",false);
    }else if(!usedMap[text]){
        usedMap[text]=now;
        totalValid++;
        showPopup("✅ Válido",true);
        history.innerHTML+=`<span class="badge valid">${text}</span>`;
    }else{
        totalUsed++;
        showPopup("⚠️ Já usado","warn");
    }

    localStorage.setItem(STORAGE_USED_KEY,JSON.stringify(usedMap));
    localStorage.setItem(STORAGE_COUNT_VALID,totalValid);
    localStorage.setItem(STORAGE_COUNT_USED,totalUsed);
    localStorage.setItem(STORAGE_COUNT_INVALID,totalInvalid);

    updateCounters();
    setTimeout(()=>scanning=true,600);
}

/* ================== LANERNA ================== */
toggleLight.onclick=async()=>{
    if(!html5Qr) return;

    try{
        flashOn=!flashOn;
        await html5Qr.applyVideoConstraints({
            advanced:[{torch:flashOn}]
        });

        if(flashOn){
            sFlashOn.play();
            showPopup("🔦 Lanterna ligada",true);
            toggleLight.textContent="🔦 Desligar lanterna";
        }else{
            sFlashOff.play();
            showPopup("🔦 Lanterna desligada","warn");
            toggleLight.textContent="🔦 Lanterna";
        }
    }catch(e){
        console.error(e);
        showPopup("Lanterna não suportada",false);
    }
};

/* ================== PORTARIA ================== */
addPortaria.onclick=()=>{
    const nova=novaPortaria.value.trim().toUpperCase();
    if(!nova) return showPopup("Digite a portaria","warn");
    if(portarias.includes(nova)) return showPopup("Portaria já existe","warn");

    portarias.push(nova);
    localStorage.setItem(STORAGE_PORTARIAS,JSON.stringify(portarias));
    portaria=nova;
    localStorage.setItem(STORAGE_PORTARIA,portaria);
    portariaAtual.textContent=portaria;
    novaPortaria.value="";
    showPopup(`Portaria ${nova} adicionada`,true);
    sValid.play();
};

/* ================== RESET ================== */
reset.onclick=()=>{
    if(!confirm("Deseja resetar tudo?")) return;
    usedMap={};
    totalValid=totalUsed=totalInvalid=0;
    history.innerHTML="";
    localStorage.clear();
    updateCounters();
    showPopup("Sistema resetado",true);
    sWarning.play();
};

/* ================== TROCA DE CÂMERA ================== */
switchCam.onclick=async()=>{
    if(cameras.length<2){
        showPopup("Não há câmeras suficientes para alternar",false);
        return;
    }

    currentCam = (currentCam + 1) % cameras.length; // Alterna entre 0 e 1
    await html5Qr.stop(); // Para a câmera atual
    await html5Qr.start(cameras[currentCam].id, { fps: 10, qrbox: 250 }, processQR); // Inicia a nova câmera
    showPopup(`📷 Câmera ${currentCam === 0 ? "Traseira" : "Frontal"} ativada`, true);
    sFlashOn.play(); // som da troca de câmera
};

/* ================== INIT QR ================== */
(async()=>{
    html5Qr=new Html5Qrcode("reader");
    cameras=await Html5Qrcode.getCameras();
    await html5Qr.start(cameras[currentCam].id, { fps: 10, qrbox: 250 }, processQR);
})();
</script>

</body>
</html>

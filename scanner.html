<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    background: #1a0000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-bottom: 40px;
}
h2 { margin-top: 20px; }

#reader {
    width: 350px;
    margin: 20px auto;
    border: 4px solid #ff0000;
    border-radius: 12px;
}
.btn {
    background: #ff0000;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    margin: 8px auto;
    width: 90%;
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}
#msgPop {
    display:none;
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: #ff4444;
    color: #fff;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    z-index: 9999;
    opacity: 0;
    transition: all 0.5s ease;
}
#msgPop.green { background: #00ff88; color: #003300; }
#msgPop.yellow { background: #ffaa00; color: #330000; }
#msgPop.show { top: 20px; opacity: 1; }

#history { margin-top: 20px; padding: 10px; }
.badge {
    display: inline-block;
    margin: 5px;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 14px;
    background: #330000;
    border: 1px solid #ff4444;
    color: #fff;
}
.badge.valid { background: #003314; border-color: #00ff88; }

#counters { margin-top: 10px; }
.counter-box {
    background: #330000;
    border: 2px solid #ff0000;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 15px;
    margin:4px;
    display:inline-block
}
.portaria-box{ margin-top:10px; font-size:18px; font-weight:bold }
</style>
</head>
<body>

<h2>📡 ESIP - Sistemas</h2>

<div class="portaria-box">
    🚪 Portaria: <span id="portariaAtual">A</span>
</div>

<div id="counters">
    <div class="counter-box">Válidos: <span id="countValid">0</span></div>
    <div class="counter-box">Usados: <span id="countUsed">0</span></div>
    <div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
    <div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>
<button id="adminPortaria" class="btn">🔐 Trocar Portaria</button>

<!-- NOVO CAMPO -->
<input id="novaPortaria" placeholder="➕ Nova Portaria (ex: A, VIP, CAMAROTE)">
<button id="addPortaria" class="btn">➕ Adicionar Portaria</button>

<input id="searchInput" placeholder="🔍 Buscar por ID">
<button id="searchBtn" class="btn">🔎 Buscar por ID</button>

<button id="reset" class="btn">🗑️ Resetar Ingressos</button>
<button id="export" class="btn">📤 Exportar CSV</button>

<input id="pdfTitulo" placeholder="📝 Título do PDF">
<input id="pdfLogo" type="file" accept="image/*">
<button id="exportPDF" class="btn">📄 Exportar PDF</button>

<div id="msgPop"></div>

<h3>📜 Histórico</h3>
<div id="history"></div>

<script>
const STORAGE_USED_KEY = "usedCodesMap_v1";
const STORAGE_PORTARIA = "portariaAtual";
const STORAGE_PORTARIAS = "listaPortarias";
const STORAGE_COUNT_VALID = "countValid";
const STORAGE_COUNT_USED = "countUsed";
const STORAGE_COUNT_INVALID = "countInvalid";
const RESET_PASSWORD = "ESIP2025";

let portarias = JSON.parse(localStorage.getItem(STORAGE_PORTARIAS)) || ["A","B","C"];

let html5Qr, flashOn=true, scanning=true, currentCam=0, cameras=[];
let usedMap={}, lastCode="", lastTime=0;

let portaria = localStorage.getItem(STORAGE_PORTARIA) || portarias[0];
document.getElementById("portariaAtual").textContent = portaria;

const sValid=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const sInvalid=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const sWarning=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

let totalValid=+localStorage.getItem(STORAGE_COUNT_VALID)||0;
let totalUsed=+localStorage.getItem(STORAGE_COUNT_USED)||0;
let totalInvalid=+localStorage.getItem(STORAGE_COUNT_INVALID)||0;

function showPopup(t,o){
    const m=document.getElementById("msgPop");
    m.textContent=t;
    m.className=(o===true?"green":o===false?"":"yellow")+" show";
    (o===true?sValid:o===false?sInvalid:sWarning).play();
    m.style.display="block";
    setTimeout(()=>{m.className="";m.style.display="none"},2500);
}

function validateCode(code){
    if(!code.startsWith("ID: ")) return false;
    const clean=code.replace("ID: ","").split("-INGR-");
    return clean.length===2 && clean[0]===portaria;
}

function processQR(text){
    if(!scanning) return;
    scanning=false;
    const now=Date.now();
    if(text===lastCode && now-lastTime<3000){scanning=true;return;}
    lastCode=text;lastTime=now;

    if(!validateCode(text)){totalInvalid++;showPopup("❌ QR inválido",false);}
    else if(!usedMap[text]){usedMap[text]=now;totalValid++;showPopup("✅ Válido",true);}
    else{totalUsed++;showPopup("⚠️ Já usado","aviso");}

    localStorage.setItem(STORAGE_USED_KEY,JSON.stringify(usedMap));
    localStorage.setItem(STORAGE_COUNT_VALID,totalValid);
    localStorage.setItem(STORAGE_COUNT_USED,totalUsed);
    localStorage.setItem(STORAGE_COUNT_INVALID,totalInvalid);
    setTimeout(()=>scanning=true,600);
}

document.getElementById("addPortaria").onclick=()=>{
    const nova=document.getElementById("novaPortaria").value.trim().toUpperCase();
    if(!nova) return showPopup("Digite a portaria","aviso");
    if(portarias.includes(nova)) return showPopup("Portaria já existe","aviso");
    portarias.push(nova);
    localStorage.setItem(STORAGE_PORTARIAS,JSON.stringify(portarias));
    portaria=nova;
    localStorage.setItem(STORAGE_PORTARIA,portaria);
    document.getElementById("portariaAtual").textContent=portaria;
    document.getElementById("novaPortaria").value="";
    showPopup(`Portaria ${nova} adicionada`,true);
};

(async()=>{
    html5Qr=new Html5Qrcode("reader");
    cameras=await Html5Qrcode.getCameras();
    await html5Qr.start(cameras[0].id,{fps:10,qrbox:250},processQR);
})();
</script>

</body>
</html>

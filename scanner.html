<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    background:#1a0000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding-bottom:40px
}
#reader{
    width:350px;
    margin:20px auto;
    border:4px solid #ff0000;
    border-radius:12px
}
.btn{
    background:#ff0000;
    color:#fff;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    margin:8px auto;
    width:90%
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}
.counter-box{
    background:#330000;
    border:2px solid #ff0000;
    padding:8px 12px;
    border-radius:10px;
    font-size:15px;
    margin:4px;
    display:inline-block
}
#msgPop{
    display:none;
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    border-radius:12px;
    font-weight:bold;
    z-index:9999
}
#msgPop.green{background:#00ff88;color:#003300}
#msgPop.yellow{background:#ffaa00;color:#330000}
#msgPop.red{background:#ff4444;color:#fff}
</style>
</head>

<body>

<h2>📡 ESIP - Sistemas</h2>

<div>🚪 Portaria: <b id="portariaAtual">A</b></div>

<div>
<div class="counter-box">Válidos: <span id="countValid">0</span></div>
<div class="counter-box">Usados: <span id="countUsed">0</span></div>
<div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
<div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>
<button id="adminPortaria" class="btn">🔐 Trocar Portaria</button>
<button id="addPortaria" class="btn">➕ Adicionar Portaria</button>

<div id="msgPop"></div>

<script>
const RESET_PASSWORD="ESIP2025";
const STORAGE_USED="usedCodes";
const STORAGE_PORTARIA="portariaAtual";
const STORAGE_PORTARIAS="listaPortarias";

let portarias=JSON.parse(localStorage.getItem(STORAGE_PORTARIAS))||["A","B","C"];
let portaria=localStorage.getItem(STORAGE_PORTARIA)||portarias[0];
portariaAtual.textContent=portaria;

let usedMap=JSON.parse(localStorage.getItem(STORAGE_USED))||{};
let totalValid=0,totalUsed=0,totalInvalid=0;

const sValid=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const sInvalid=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const sWarning=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let audioUnlocked=false;

function unlockAudio(){
    if(audioUnlocked) return;
    sValid.play().then(()=>{sValid.pause();sValid.currentTime=0});
    audioUnlocked=true;
}

document.body.addEventListener("click",unlockAudio,{once:true});

function popup(txt,type){
    msgPop.textContent=txt;
    msgPop.className=type;
    msgPop.style.display="block";
    setTimeout(()=>msgPop.style.display="none",2000);
}

function updateUI(){
countValid.textContent=totalValid;
countUsed.textContent=totalUsed;
countInvalid.textContent=totalInvalid;
countMemory.textContent=Object.keys(usedMap).length;
}

function validateCode(code){
if(!code.startsWith("ID: "))return false;
return code.replace("ID: ","").split("-INGR-")[0]===portaria;
}

let html5Qr,cameras=[],cam=0,track=null,torch=false;

async function startScanner(){
html5Qr=new Html5Qrcode("reader");
cameras=await Html5Qrcode.getCameras();
await html5Qr.start(
cameras[cam].id,
{fps:10,qrbox:250},
(text)=>{
if(!validateCode(text)){
totalInvalid++; sInvalid.play(); popup("❌ QR inválido","red");
}else if(!usedMap[text]){
usedMap[text]=Date.now();
totalValid++; sValid.play(); popup("✅ Válido","green");
}else{
totalUsed++; sWarning.play(); popup("⚠️ Já usado","yellow");
}
localStorage.setItem(STORAGE_USED,JSON.stringify(usedMap));
updateUI();
}
);
track=html5Qr.getRunningTrack();
}

toggleLight.onclick=()=>{
if(!track||!track.getCapabilities().torch){
popup("Lanterna não suportada","red"); return;
}
torch=!torch;
track.applyConstraints({advanced:[{torch:torch}]});
};

switchCam.onclick=async()=>{
await html5Qr.stop();
cam=(cam+1)%cameras.length;
startScanner();
};

adminPortaria.onclick=()=>{
if(prompt("Senha")!==RESET_PASSWORD)return;
let i=portarias.indexOf(portaria);
portaria=portarias[(i+1)%portarias.length];
localStorage.setItem(STORAGE_PORTARIA,portaria);
portariaAtual.textContent=portaria;
popup("Portaria "+portaria,"green");
};

addPortaria.onclick=()=>{
if(prompt("Senha")!==RESET_PASSWORD)return;
let n=prompt("Nova Portaria").toUpperCase();
if(!n||portarias.includes(n))return;
portarias.push(n);
localStorage.setItem(STORAGE_PORTARIAS,JSON.stringify(portarias));
popup("Portaria "+n+" criada","green");
};

startScanner();
updateUI();
</script>

</body>
</html>

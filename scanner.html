<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Gerador ESIP Profissional</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background: #2b0000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: #3a0000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 12px #ff000033;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 15px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-top: 5px;
            background: #550000;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            margin-top: 18px;
            cursor: pointer;
        }
        #qrcode {
            margin-top: 20px;
        }
        #previewLogo {
            max-width: 100px;
            margin-top: 8px;
            border-radius: 6px;
            display: none;
        }
        #previewLogoPDF {
            max-width: 80px;
            margin-top: 5px;
            display: none;
        }
        #loginBox, #adminArea {
            display: none;
            background: #1a0000;
            padding: 20px;
            border-radius: 12px;
            max-width: 900px;
            margin: 40px auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #660000;
            padding: 6px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #330000;
        }
        .small {
            font-size: 13px;
            opacity: .9;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 18px;
        }
        .notice {
            margin-top: 8px;
            color: #aaffcc;
        }
        .admin-tools {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .admin-tools input {
            flex: 1;
        }
        .admin-tools button {
            width: auto;
            padding: 10px 14px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="header-row">
    <h2>📡 ESIP - Gerador de Ingressos</h2>
    <button onclick="mostrarLogin()">🔐 Área do Administrador</button>
</div>

<div class="container">
    <label>Nome:</label>
    <input id="nome">

    <label>Evento:</label>
    <input id="evento" oninput="this.value=this.value.toUpperCase(); EVENTO_ATUAL=this.value; localStorage.setItem('eventoAtual', EVENTO_ATUAL);">

    <label>Logo do Evento:</label>
    <input type="file" id="logoEvento" accept="image/*">
    <img id="previewLogo">

    <label>Portaria:</label>
    <select id="portaria">
        <option value="A">Portaria A</option>
        <option value="B">Portaria B</option>
        <option value="C">Portaria C</option>
    </select>

    <label>CPF:</label>
    <input id="cpf" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">

    <button onclick="gerarQR()">Gerar QR</button>
    <div id="qrcode"></div>
    <button onclick="baixarPDF()">📄 Baixar PDF</button>
    <p id="status" class="notice"></p>
</div>

<!-- NOVOS CAMPOS PARA PDF DE PORTARIA -->
<div class="container" style="margin-top:20px;">
    <h3>Configuração PDF Portaria</h3>
    <label>Título do PDF:</label>
    <input id="tituloPortaria" placeholder="Ex: RELATÓRIO DE PORTARIA">

    <label>Logo para PDF:</label>
    <input type="file" id="logoPDFPortaria" accept="image/*">
    <img id="previewLogoPDF" style="max-width:80px; display:none; margin-top:5px;">
</div>

<!-- Login Administrador -->
<div id="loginBox" style="display:none;">
    <h3>🔐 Login do Administrador</h3>
    <input id="senhaAdmin" type="password">
    <button onclick="validarAdmin()">Entrar</button>
    <button onclick="fecharLogin()">Cancelar</button>
</div>

<!-- Área Administrador -->
<div id="adminArea" style="display:none;">
    <h2>📋 Registros</h2>
    <div class="small">Total: <span id="contadorRegistros">0</span></div>

    <div class="admin-tools">
        <input id="buscarCPF" placeholder="Buscar por CPF">
        <button onclick="buscarPorCPF()">🔍 Buscar</button>
        <button onclick="carregarRegistros()">🔄 Limpar</button>
    </div>

    <button onclick="exportCSV()">📤 Exportar CSV</button>
    <button onclick="exportarPDFPortaria()">📄 Exportar PDF por Portaria</button>
    <button onclick="limparRegistros()">🗑️ Limpar Tudo</button>
    <button onclick="fecharAdmin()">🔙 Voltar</button>

    <div>
        <h3>Gerenciar Portarias</h3>
        <input type="text" id="novaPortaria" placeholder="Nova portaria">
        <button onclick="adicionarPortaria()">Adicionar Portaria</button>
        <div id="listaPortarias">
            <!-- Portarias dinâmicas serão listadas aqui -->
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Evento</th>
                <th>CPF</th>
                <th>Portaria</th>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="registrosTabela"></tbody>
    </table>
</div>

<script>
// Variáveis Globais
let ultimoID = "", LOGO_EVENTO_DATAURL = "", LOGO_PORTARIA_DATAURL = "";
let EVENTO_ATUAL = localStorage.getItem("eventoAtual") || "";
let portariasAdicionais = JSON.parse(localStorage.getItem("portariasAdicionais") || "[]");

// Atualiza o <select> de portarias no formulário principal
function atualizarSelectPortarias() {
    const select = document.getElementById("portaria");
    const portariasPadrao = ["A", "B", "C"];
    select.innerHTML = ""; // Limpa todas as opções
    // Adiciona as portarias padrão
    [...portariasPadrao, ...portariasAdicionais].forEach(p => {
        const option = document.createElement("option");
        option.value = p;
        option.textContent = "Portaria " + p;
        select.appendChild(option);
    });
}

// Atualiza a lista de portarias na área administrativa
function atualizarListaPortarias() {
    const listaPortarias = document.getElementById("listaPortarias");
    listaPortarias.innerHTML = "";
    // Mostra as portarias A, B, C + as portarias personalizadas
    const todasPortarias = ["A", "B", "C", ...portariasAdicionais];
    todasPortarias.forEach(portaria => {
        listaPortarias.innerHTML += `
            <div>
                <span>${portaria}</span>
                <button onclick="editarPortaria('${portaria}')">✏️ Editar</button>
                <button onclick="excluirPortaria('${portaria}')">🗑️ Excluir</button>
            </div>
        `;
    });
    atualizarSelectPortarias(); // Atualiza o select no formulário principal
}

// Adicionar nova portaria
function adicionarPortaria() {
    const novaPortaria = document.getElementById("novaPortaria").value.trim();
    if (!novaPortaria) {
        alert("Digite o nome da nova portaria.");
        return;
    }

    const portariasPadrao = ["A", "B", "C"];
    if (portariasPadrao.includes(novaPortaria) || portariasAdicionais.includes(novaPortaria)) {
        alert("Portaria já existe ou é inválida.");
        return;
    }

    // Adiciona a nova portaria à lista de portarias adicionais
    portariasAdicionais.push(novaPortaria);
    localStorage.setItem("portariasAdicionais", JSON.stringify(portariasAdicionais));

    // Atualiza a lista de portarias na área administrativa e no formulário
    atualizarListaPortarias();

    // Limpa o campo de texto para adicionar outra portaria
    document.getElementById("novaPortaria").value = "";
    alert("Portaria adicionada com sucesso!");
}

// Editar uma portaria personalizada
function editarPortaria(portaria) {
    const novoNome = prompt("Digite o novo nome para a portaria:", portaria);
    if (!novoNome || ["A", "B", "C"].includes(novoNome) || portariasAdicionais.includes(novoNome)) {
        alert("Portaria inválida ou já existe.");
        return;
    }

    // Encontra a portaria na lista de portarias adicionais e a substitui
    const index = portariasAdicionais.indexOf(portaria);
    if (index !== -1) {
        portariasAdicionais[index] = novoNome;
        localStorage.setItem("portariasAdicionais", JSON.stringify(portariasAdicionais));
    }

    // Atualiza a lista de portarias na área administrativa e no formulário
    atualizarListaPortarias();
}

// Excluir uma portaria personalizada
function excluirPortaria(portaria) {
    if (confirm(`Tem certeza que deseja excluir a portaria ${portaria}?`)) {
        // Filtra a portaria da lista e atualiza o LocalStorage
        portariasAdicionais = portariasAdicionais.filter(p => p !== portaria);
        localStorage.setItem("portariasAdicionais", JSON.stringify(portariasAdicionais));

        // Atualiza a lista de portarias na área administrativa e no formulário
        atualizarListaPortarias();
    }
}

// Função de Gerar QR
function gerarQR() {
    const n = nome.value.trim(), e = EVENTO_ATUAL, c = cpf.value.trim(), p = portaria.value;
    if (!n || !e || c.length !== 11) return alert("Dados inválidos ou evento não definido");

    const dataHora = new Date().toLocaleString();
    ultimoID = p + "-INGR-" + Math.random().toString(36).substr(2, 8).toUpperCase();

    qrcode.innerHTML = "";
    new QRCode(qrcode, { text: "ID: " + ultimoID, width: 250, height: 250 });

    let r = _getRegistros();
    r.push({ nome: n, evento: e, cpf: c, portaria: p, id: ultimoID, dataHora });
    _setRegistros(r);

    status.textContent = "QR gerado: " + ultimoID;
}

// Função de PDF
function baixarPDF() {
    if (!ultimoID) return;
    const r = _getRegistros().find(x => x.id === ultimoID);
    const { jsPDF } = window.jspdf;
    const d = new jsPDF();

    if (LOGO_EVENTO_DATAURL) d.addImage(LOGO_EVENTO_DATAURL, "PNG", 14, 14, 40, 40);
    d.setFontSize(26);
    d.text(r.evento, LOGO_EVENTO_DATAURL ? 60 : 14, 30);

    let y = 60;
    d.setFontSize(16);
    d.text("Nome: " + r.nome, 14, y); y += 10;
    d.text("CPF: " + r.cpf, 14, y); y += 10;
    d.text("Portaria: " + r.portaria, 14, y); y += 10;
    d.text("ID: " + r.id, 14, y); y += 10;
    d.text("Data/Hora: " + r.dataHora, 14, y); y += 14;

    d.setFontSize(36);
    d.setTextColor(255, 0, 0);
    const w = d.internal.pageSize.getWidth();
    const t = "PORTARIA " + r.portaria;
    d.text(t, (w - d.getTextWidth(t)) / 2, y); y += 20;

    const img = qrcode.querySelector("canvas").toDataURL("image/png");
    d.addImage(img, "PNG", (w - 120) / 2, y, 120, 120);

    const nomePDF = EVENTO_ATUAL.trim().replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
    d.save(nomePDF + ".pdf");

    ultimoID = "";
    nome.value = "";
    cpf.value = "";
    portaria.value = "A";
    qrcode.innerHTML = "";
    status.textContent = "Pronto para o próximo ingresso";
}

// Funções Administrativas (Login e Carregamento)
function mostrarLogin() { loginBox.style.display = "block"; }
function fecharLogin() { loginBox.style.display = "none"; }
function validarAdmin() {
    if (senhaAdmin.value === "ADMIN2025") {
        loginBox.style.display = "none";
        adminArea.style.display = "block";
        carregarRegistros();
        atualizarListaPortarias(); // Atualiza a lista de portarias na área admin
    } else alert("Senha incorreta");
}
function fecharAdmin() { adminArea.style.display = "none"; }
function carregarRegistros() {
    const t = registrosTabela;
    t.innerHTML = "";
    const r = _getRegistros();
    contadorRegistros.textContent = r.length;
    r.forEach((x, i) => {
        t.innerHTML += `<tr>
        <td>${x.nome}</td>
        <td>${x.evento}</td>
        <td>${x.cpf}</td>
        <td>${x.portaria}</td>
        <td>${x.id}</td>
        <td>${x.dataHora}</td>
        <td><button onclick="excluirRegistro(${i})">🗑️</button></td>
        </tr>`;
    });
}

function excluirRegistro(i) {
    if (!confirm("Excluir este registro?")) return;
    let r = _getRegistros();
    r.splice(i, 1);
    _setRegistros(r);
    carregarRegistros();
}

// Funções de Exportação
function exportCSV() {
    const registros = _getRegistros();
    if (!registros.length) {
        alert("Nenhum registro para exportar");
        return;
    }

    let csv = "Nome,Evento,CPF,Portaria,ID,Data/Hora\n";
    registros.forEach(r => {
        csv += `"${r.nome}","${r.evento}","${r.cpf}","${r.portaria}","${r.id}","${r.dataHora}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "registros_esip.csv";
    a.click();

    URL.revokeObjectURL(url);
}

function exportarPDFPortaria() {
    const registros = _getRegistros();
    if (!registros.length) {
        alert("Nenhum registro para exportar");
        return;
    }

    const tituloManual = document.getElementById("tituloPortaria").value.trim() || "RELATÓRIO DE PORTARIA";
    const { jsPDF } = window.jspdf;
    const portarias = ["A", "B", "C"];
    const evento = EVENTO_ATUAL || "Evento Não Definido";
    const dataAtual = new Date().toLocaleDateString("pt-BR");

    const pdf = new jsPDF();

    portarias.forEach((portaria, index) => {
        const lista = registros.filter(r => r.portaria === portaria);
        if (!lista.length) return;

        if (index > 0) pdf.addPage();
        let y = 20;

        // LOGO PDF PORTARIA (centralizado)
        if (LOGO_PORTARIA_DATAURL) {
            pdf.addImage(LOGO_PORTARIA_DATAURL, "PNG", (pdf.internal.pageSize.width - 30) / 2, 10, 30, 30);
            y = 45;
        }

        // TÍTULO
        pdf.setFontSize(18);
        const tituloWidth = pdf.getTextWidth(tituloManual);
        pdf.text(tituloManual, (pdf.internal.pageSize.width - tituloWidth) / 2, y);
        y += 10;

        // Evento + Data
        pdf.setFontSize(12);
        pdf.text(evento, (pdf.internal.pageSize.width - pdf.getTextWidth(evento)) / 2, y);
        y += 10;
        pdf.text(`Data: ${dataAtual}`, 14, y);
        y += 12;

        // Portaria + quantidade
        const portariaTitle = `Portaria: ${portaria}`;
        pdf.setFontSize(14);
        pdf.text(portariaTitle, 14, y);
        y += 8;

        lista.forEach(r => {
            pdf.setFontSize(10);
            pdf.text(`${r.nome} | ${r.cpf}`, 14, y);
            y += 8;
        });

        pdf.text(`Total: ${lista.length} registros`, 14, y);
    });

    pdf.save("relatorio_portarias.pdf");
}

</script>
</body>
</html>

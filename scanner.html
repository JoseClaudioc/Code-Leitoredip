<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 ESIP - Sistemas</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    background: #1a0000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-bottom: 40px;
}
h2 { margin-top: 20px; }

#reader {
    width: 350px;
    margin: 20px auto;
    border: 4px solid #ff0000;
    border-radius: 12px;
}
.btn {
    background: #ff0000;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    margin: 8px auto;
    width: 90%;
}
input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-top:8px
}
#msgPop {
    display:none;
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: #ff4444;
    color: #fff;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    z-index: 9999;
    opacity: 0;
    transition: all 0.5s ease;
}
#msgPop.green { background: #00ff88; color: #003300; }
#msgPop.yellow { background: #ffaa00; color: #330000; }
#msgPop.show { top: 20px; opacity: 1; }

.badge {
    display:inline-block;
    margin:5px;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
    background:#330000;
    border:1px solid #ff4444;
}
.badge.valid { background:#003314; border-color:#00ff88; }

.counter-box {
    background:#330000;
    border:2px solid #ff0000;
    padding:8px 12px;
    border-radius:10px;
    font-size:15px;
    margin:4px;
    display:inline-block
}
.portaria-box{margin-top:10px;font-size:18px;font-weight:bold}
</style>
</head>

<body>

<h2>📡 ESIP - Sistemas</h2>

<div class="portaria-box">
🚪 Portaria: <span id="portariaAtual">A</span>
</div>

<div id="counters">
<div class="counter-box">Válidos: <span id="countValid">0</span></div>
<div class="counter-box">Usados: <span id="countUsed">0</span></div>
<div class="counter-box">Inválidos: <span id="countInvalid">0</span></div>
<div class="counter-box">🧠 Memória: <span id="countMemory">0</span></div>
</div>

<div id="reader"></div>

<button id="toggleLight" class="btn">🔦 Lanterna</button>
<button id="switchCam" class="btn">🔄 Trocar Câmera</button>
<button id="adminPortaria" class="btn">🔐 Trocar Portaria</button>
<button id="addPortaria" class="btn">➕ Adicionar Portaria</button>

<input id="searchInput" placeholder="🔍 Buscar por ID">
<button id="searchBtn" class="btn">🔎 Buscar por ID</button>

<button id="reset" class="btn">🗑️ Resetar Ingressos</button>
<button id="export" class="btn">📤 Exportar CSV</button>

<div id="msgPop"></div>

<h3>📜 Histórico</h3>
<div id="history"></div>

<script>
const STORAGE_USED_KEY="usedCodesMap_v1";
const STORAGE_PORTARIA="portariaAtual";
const RESET_PASSWORD="ESIP2025";

let portarias = JSON.parse(localStorage.getItem("listaPortarias")) || ["A","B","C"];
let portaria = localStorage.getItem(STORAGE_PORTARIA) || portarias[0];
document.getElementById("portariaAtual").textContent = portaria;

let usedMap = JSON.parse(localStorage.getItem(STORAGE_USED_KEY)) || {};

let totalValid=0,totalUsed=0,totalInvalid=0;

function showPopup(text,type){
const m=document.getElementById("msgPop");
m.textContent=text;
m.className=type==="ok"?"green show":type==="warn"?"yellow show":"show";
m.style.display="block";
setTimeout(()=>{m.style.display="none"},2500);
}

function validateCode(code){
if(!code.startsWith("ID: ")) return false;
const p=code.replace("ID: ","").split("-INGR-");
return p[0]===portaria;
}

function processQR(text){
if(validateCode(text)){
if(!usedMap[text]){
usedMap[text]=Date.now();
totalValid++;
showPopup("✅ Válido","ok");
}else{
totalUsed++;
showPopup("⚠️ Já usado","warn");
}
}else{
totalInvalid++;
showPopup("❌ Inválido","err");
}
localStorage.setItem(STORAGE_USED_KEY,JSON.stringify(usedMap));
updateUI();
}

function updateUI(){
document.getElementById("countValid").textContent=totalValid;
document.getElementById("countUsed").textContent=totalUsed;
document.getElementById("countInvalid").textContent=totalInvalid;
document.getElementById("countMemory").textContent=Object.keys(usedMap).length;
}

document.getElementById("adminPortaria").onclick=()=>{
if(prompt("Senha")!==RESET_PASSWORD) return;
let i=portarias.indexOf(portaria);
portaria=portarias[(i+1)%portarias.length];
localStorage.setItem(STORAGE_PORTARIA,portaria);
document.getElementById("portariaAtual").textContent=portaria;
showPopup("Portaria: "+portaria,"ok");
};

document.getElementById("addPortaria").onclick=()=>{
if(prompt("Senha")!==RESET_PASSWORD) return;
let n=prompt("Nova Portaria").toUpperCase();
if(!n||portarias.includes(n)) return showPopup("Inválida","warn");
portarias.push(n);
localStorage.setItem("listaPortarias",JSON.stringify(portarias));
showPopup("Adicionada: "+n,"ok");
};

updateUI();
</script>

</body>
</html>
